name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Build and verify universal app
        env:
          ARCHITECTURES: arm64 x86_64
          ARCHIVE_ARCH: universal
          EXPECTED_ARCHITECTURES: arm64 x86_64
        run: ./scripts/release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/CursorBar-*.zip
            dist/CursorBar-*.zip.sha256
          generate_release_notes: true
