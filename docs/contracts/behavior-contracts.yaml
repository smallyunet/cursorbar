contracts:
  - id: USAGE-SEMANTICS-001
    title: Usage values are server-backed and fail closed
    statement: CursorBar displays only values present in Cursor responses or calculations whose inputs are all present. Unlimited plans display Unlimited and never an error marker.
    risk: high
    guards:
      - Tests/CursorBarTests/UsageResolutionTests.swift
      - Tests/CursorBarTests/CoreBehaviorTests.swift

  - id: PRIVACY-BOUNDARY-002
    title: Cursor credentials remain minimally exposed
    statement: CursorBar reads the local Cursor token in memory, sends it only over HTTPS to the original cursor.com host, and never logs or persists credentials or raw responses.
    risk: critical
    guards:
      - Sources/CursorBar/SecureNetworkSession.swift
      - Sources/CursorBar/TokenProvider.swift

  - id: AGENT-HEURISTICS-003
    title: Agent status is explicitly heuristic
    statement: Local and cloud agent counts are inferred from recent Cursor-owned local state. Missing or malformed state produces no fabricated agent details.
    risk: medium
    guards:
      - Sources/CursorBar/AgentMonitor.swift
      - Tests/CursorBarTests/CoreBehaviorTests.swift

  - id: UPDATE-CHECK-004
    title: Update checks are manual and informational
    statement: CursorBar checks the fixed smallyunet/cursorbar GitHub endpoint only after user action, validates the release page, and never downloads or replaces the application.
    risk: high
    guards:
      - Sources/CursorBar/UpdateChecker.swift
      - Tests/CursorBarTests/CoreBehaviorTests.swift

  - id: RELEASE-005
    title: Tags produce verified universal artifacts
    statement: A semantic version tag matching Info.plist produces a tested universal app, ZIP, and SHA-256 file after bundle verification.
    risk: high
    guards:
      - .github/workflows/release.yml
      - scripts/verify.sh
      - scripts/verify_app.sh
